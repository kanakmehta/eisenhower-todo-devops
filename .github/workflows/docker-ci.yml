name: CI - Test, Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python for automationTesting.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Python requests library
      - name: Install Python dependencies
        run: pip install requests

      # 4. Build and start Express + MongoDB containers
      - name: Start application with Docker Compose
        run: docker compose up -d --build

      # 5. Wait for application to become available
      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/; then
              echo "Application is ready!"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start."
          docker compose logs
          exit 1

      # 6. Run automated route testing
      - name: Run automated tests
        run: python automationTesting.py

      # 7. Login to Docker Hub securely
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Build final Docker image
      - name: Build Docker image
        run: |
          docker build -t kanak1234567890/eisenhower-todo:latest .

      # 9. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push kanak1234567890/eisenhower-todo:latest