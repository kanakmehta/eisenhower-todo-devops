services:

  mongo:
    image: mongo:7
    container_name: eisenhower-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: eisenhower-todo-app
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - PORT=3000
    depends_on:
      - mongo

volumes:
  mongo-data: